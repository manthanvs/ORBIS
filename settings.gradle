pluginManagement {
    repositories {
        google {
            content {
                // Slashy strings, so the regex escapes need no escaping of their own.
                includeGroupByRegex(/com\.android.*/)
                includeGroupByRegex(/com\.google.*/)
                includeGroupByRegex(/androidx.*/)
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'ORBIS - Optimized Responsible Browsing & Intervention System'
include ':app'
