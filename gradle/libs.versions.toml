[versions]
agp = "9.2.1"

# compileSdk is 36, which caps some AndroidX libraries. Each AAR declares a
# `minCompileSdk` and the build hard-fails if it exceeds ours, so check that
# before bumping: core 1.19.0 and lifecycle 2.11.0 both require 37.
core = "1.18.0"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.4.0"
fragment = "1.8.9"
lifecycle = "2.10.0"

room = "2.8.4"
workManager = "2.11.2"

archCoreTesting = "2.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workManager" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Runs LiveData's posts inline, so a JVM test can touch a StateHolder
# without a main looper.
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
